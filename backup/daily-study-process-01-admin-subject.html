<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Study — 관리자: 과목/단원 등록 관리</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'JetBrains Mono',monospace; background:#020617; min-height:100vh; padding:2rem; color:white; }
    .container { max-width:1100px; margin:0 auto; }
    .header { margin-bottom:2rem; }
    .header-row { display:flex; align-items:center; gap:1rem; margin-bottom:0.5rem; }
    .pulse-dot { width:12px; height:12px; background:#fbbf24; border-radius:50%; animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
    h1 { font-size:1.4rem; font-weight:700; }
    .subtitle { color:#94a3b8; font-size:0.875rem; margin-left:1.75rem; }
    .diagram-container { background:rgba(15,23,42,0.5); border-radius:1rem; border:1px solid #1e293b; padding:1.5rem; overflow-x:auto; }
    svg { width:100%; min-width:800px; display:block; }
    .nav { display:flex; gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap; }
    .nav a { padding:8px 16px; border-radius:8px; border:1px solid #1e293b; background:rgba(15,23,42,0.5); color:#94a3b8; text-decoration:none; font-size:0.8rem; transition:all 0.2s; }
    .nav a:hover { border-color:#fbbf24; color:#fbbf24; }
    .nav a.active { background:rgba(120,53,15,0.3); border-color:#fbbf24; color:#fbbf24; }
    .footer { text-align:center; margin-top:1.5rem; color:#475569; font-size:0.75rem; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-row"><div class="pulse-dot"></div><h1>Daily Study — 관리자 프로세스</h1></div>
    <p class="subtitle">1/4 · 과목/단원 등록 관리</p>
  </div>
  <div class="nav">
    <a href="daily-study-process-01-admin-subject.html" class="active">① 과목/단원 관리</a>
    <a href="daily-study-process-02-admin-quiz.html">② 문제 생성→승인</a>
    <a href="daily-study-process-03-student.html">③ 학생 학습/풀이</a>
    <a href="daily-study-process-04-parent.html">④ 학부모 현황/리포트</a>
  </div>
  <div class="diagram-container">
    <svg viewBox="0 0 800 580">
      <defs>
        <marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fbbf24"/></marker>
        <marker id="ah-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#34d399"/></marker>
        <marker id="ah-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fb7185"/></marker>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)"/>

      <!-- Admin Login -->
      <rect x="300" y="20" width="200" height="50" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
      <text x="400" y="42" fill="white" font-size="11" font-weight="600" text-anchor="middle">관리자 로그인</text>
      <text x="400" y="58" fill="#94a3b8" font-size="9" text-anchor="middle">Spring Security + JWT (ADMIN)</text>
      <line x1="400" y1="70" x2="400" y2="95" stroke="#fb7185" stroke-width="1.5" marker-end="url(#ah-r)"/>
      <text x="415" y="88" fill="#94a3b8" font-size="8">인증</text>

      <!-- Admin Dashboard -->
      <rect x="290" y="100" width="220" height="55" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="400" y="123" fill="white" font-size="12" font-weight="700" text-anchor="middle">관리자 대시보드</text>
      <text x="400" y="140" fill="#94a3b8" font-size="9" text-anchor="middle">운영 지표 · 메뉴 선택</text>
      <line x1="400" y1="155" x2="400" y2="180" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ah)"/>
      <text x="415" y="173" fill="#94a3b8" font-size="8">콘텐츠 관리</text>

      <!-- Content Management Menu -->
      <rect x="290" y="185" width="220" height="55" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="400" y="208" fill="white" font-size="11" font-weight="600" text-anchor="middle">콘텐츠 관리</text>
      <text x="400" y="224" fill="#94a3b8" font-size="9" text-anchor="middle">과목·단원·요약 CRUD</text>

      <!-- Branch: Subject vs Unit -->
      <line x1="350" y1="240" x2="200" y2="270" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ah)"/>
      <text x="255" y="258" fill="#94a3b8" font-size="8">과목 등록</text>
      <line x1="450" y1="240" x2="600" y2="270" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ah)"/>
      <text x="540" y="258" fill="#94a3b8" font-size="8">단원 등록</text>

      <!-- Subject Registration -->
      <rect x="80" y="275" width="190" height="80" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="175" y="298" fill="white" font-size="11" font-weight="600" text-anchor="middle">과목 등록</text>
      <text x="175" y="315" fill="#94a3b8" font-size="9" text-anchor="middle">과목명·아이콘·색상·학년</text>
      <text x="175" y="330" fill="#94a3b8" font-size="9" text-anchor="middle">예) 수학 🔷 #3B82F6</text>
      <text x="175" y="345" fill="#fbbf24" font-size="8" text-anchor="middle">→ DB 저장 (SUBJECT)</text>

      <!-- Unit Registration -->
      <rect x="520" y="275" width="190" height="80" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="615" y="298" fill="white" font-size="11" font-weight="600" text-anchor="middle">단원 등록</text>
      <text x="615" y="315" fill="#94a3b8" font-size="9" text-anchor="middle">과목선택·단원명·순서</text>
      <text x="615" y="330" fill="#94a3b8" font-size="9" text-anchor="middle">예) 3단원: 함수와 그래프</text>
      <text x="615" y="345" fill="#fbbf24" font-size="8" text-anchor="middle">→ DB 저장 (UNIT)</text>

      <!-- Both → Summary Registration -->
      <line x1="175" y1="355" x2="350" y2="390" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ah)"/>
      <line x1="615" y1="355" x2="450" y2="390" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ah)"/>

      <!-- Summary Registration -->
      <rect x="280" y="395" width="240" height="80" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="400" y="418" fill="white" font-size="11" font-weight="600" text-anchor="middle">단원 요약 등록</text>
      <text x="400" y="435" fill="#94a3b8" font-size="9" text-anchor="middle">핵심개념·공식·예시·포인트</text>
      <text x="400" y="450" fill="#94a3b8" font-size="9" text-anchor="middle">AI 생성 초안 or 직접 입력</text>
      <text x="400" y="465" fill="#fbbf24" font-size="8" text-anchor="middle">→ DB 저장 (SUMMARY, status=PENDING)</text>

      <!-- Summary → Approval -->
      <line x1="400" y1="475" x2="400" y2="500" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ah)"/>

      <!-- Summary Approval -->
      <rect x="280" y="505" width="240" height="55" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
      <text x="400" y="528" fill="white" font-size="11" font-weight="600" text-anchor="middle">요약 검수 → 승인</text>
      <text x="400" y="544" fill="#94a3b8" font-size="9" text-anchor="middle">PENDING → PUBLISHED / REJECTED</text>

      <!-- Published → Student -->
      <line x1="400" y1="560" x2="400" y2="585" stroke="#34d399" stroke-width="2" marker-end="url(#ah-g)"/>
      <text x="430" y="578" fill="#34d399" font-size="9" font-weight="600">승인 → 학생 화면 노출</text>
    </svg>
  </div>
  <p class="footer">Daily Study • 관리자 프로세스 1/4 • 2026-11-04</p>
</div>
</body>
</html>
