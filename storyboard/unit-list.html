<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수학 단원 목차 — Daily Study</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root {
  --primary: #4555FF; --primary-focus: #3651DC;
  --primary-light: #22B2FF; --secondary: #6366F1; --accent: #F59E0B;
  --gradient: linear-gradient(90deg, #22B2FF, #4555FF);
  --gradient-bg: linear-gradient(to right, #FFFFFF 0%, #E4F1FF 100%);
  --dark: #0B1026;
  --base-100: #FFFFFF; --base-200: #F2F3F6; --base-300: #E5E7EB;
  --base-content: #1B1B20; --text-secondary: #6B7280;
  --success: #22C55E; --error: #EF4444; --warning: #F59E0B; --info: #3B82F6;
  --card-bg: #FFFFFF; --card-radius: 16px;
  --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
  --card-shadow-hover: 0 4px 16px rgba(69,85,255,0.15);
  --btn-radius: 16px; --btn-shadow: 0 4px 12px rgba(69,85,255,0.3);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif; background:var(--base-200); color:var(--base-content); padding-bottom:140px; }
.header { position:sticky; top:0; z-index:50; height:56px; background:rgba(255,255,255,0.95); backdrop-filter:blur(8px); border-bottom:1px solid var(--base-200); display:flex; align-items:center; justify-content:space-between; padding:0 16px; }
.header-left { display:flex; align-items:center; gap:8px; font-size:16px; font-weight:600; }
.header-back { width:36px; height:36px; border:none; background:transparent; cursor:pointer; font-size:18px; text-decoration:none; color:inherit; }
.content { max-width:1024px; margin:0 auto; padding:16px; }
.unit-title { font-size:24px; font-weight:700; margin-bottom:4px; }
.unit-subtitle { font-size:14px; color:var(--text-secondary); margin-bottom:20px; }
/* Section Title */
.section-title { font-size:18px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
.section { margin-bottom:24px; }
/* Unit List (목차) */
.unit-list { display:flex; flex-direction:column; gap:12px; }
.unit-item { background:var(--base-100); border-radius:16px; padding:16px; box-shadow:var(--card-shadow); transition:box-shadow 0.2s; }
.unit-item:hover { box-shadow:var(--card-shadow-hover); }
.unit-item.current { border:2px solid var(--primary); }
.unit-item-head { display:flex; align-items:flex-start; gap:12px; margin-bottom:8px; }
.unit-num { width:32px; height:32px; border-radius:8px; background:var(--gradient); color:#FFF; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; flex-shrink:0; }
.unit-item-title { font-size:16px; font-weight:600; flex:1; }
.unit-progress-badge { font-size:13px; font-weight:700; padding:4px 10px; border-radius:999px; flex-shrink:0; }
.unit-progress-badge.done { background:rgba(34,197,94,0.1); color:var(--success); }
.unit-progress-badge.partial { background:rgba(69,85,255,0.1); color:var(--primary); }
.unit-progress-badge.todo { background:var(--base-200); color:#9CA3AF; }
.unit-progress-bar { height:6px; background:var(--base-200); border-radius:3px; overflow:hidden; margin-bottom:10px; }
.unit-progress-fill { height:100%; border-radius:3px; background:var(--primary); }
.unit-item-btns { display:flex; gap:8px; }
.btn-summary { padding:8px 16px; border:2px solid var(--base-300); border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; background:var(--base-100); flex:1; text-decoration:none; color:var(--base-content); text-align:center; }
.btn-summary:hover { border-color:var(--primary); color:var(--primary); }
.btn-quiz-sm { padding:8px 16px; background:var(--gradient); color:#FFF; border:none; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; flex:1; text-decoration:none; text-align:center; }
/* Bottom Nav */
.bottom-nav { position:fixed; bottom:0; left:0; right:0; height:64px; background:var(--base-100); border-top:1px solid var(--base-200); display:flex; align-items:center; justify-content:space-around; z-index:50; max-width:480px; margin:0 auto; }
.nav-item { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; color:#9CA3AF; cursor:pointer; flex:1; text-decoration:none; }
.nav-item.active { color:var(--primary); }
.nav-icon { font-size:20px; }
.nav-center-btn { width:52px; height:52px; background:var(--gradient); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; color:#FFF; margin-top:-20px; box-shadow:var(--btn-shadow); }
.nav-center-label { font-size:11px; color:var(--primary); font-weight:600; margin-top:2px; }
@media (min-width:1024px) {
  .content { padding:32px; }
  .bottom-nav { display:none; }
  body { padding-bottom:0; }
}
/* CTA Bar */
.cta-bar { position:fixed; bottom:64px; left:0; right:0; z-index:60; padding:10px 16px; background:rgba(255,255,255,0.95); backdrop-filter:blur(8px); border-top:1px solid var(--base-200); max-width:480px; margin:0 auto; box-shadow:0 -2px 8px rgba(0,0,0,0.04); }
.cta-btn { width:100%; padding:14px; background:var(--gradient); color:#FFF; border:none; border-radius:var(--btn-radius); font-size:16px; font-weight:700; font-family:inherit; cursor:pointer; box-shadow:var(--btn-shadow); transition:opacity 0.2s; }
.cta-btn:hover { opacity:0.9; }
</style>
</head>
<body>
<div class="header">
  <div class="header-left"><a href="subjects.html" class="header-back">&larr;</a> 수학</div>
</div>
<div class="content">
  <div class="unit-title">수학 &mdash; 단원 목차</div>
  <div class="unit-subtitle">20개 단원 &middot; 12개 완료 (60%)</div>

  <!-- 단원 목차 (목록 형태) -->
  <div class="section">
    <div class="section-title">📋 단원 목차</div>
    <div class="unit-list">
      <!-- Unit 1: 완료 -->
      <div class="unit-item">
        <div class="unit-item-head">
          <div class="unit-num">1</div>
          <div class="unit-item-title">유리수와 소수</div>
          <div class="unit-progress-badge done">100%</div>
        </div>
        <div class="unit-progress-bar"><div class="unit-progress-fill" style="width:100%;background:var(--success);"></div></div>
        <div class="unit-item-btns">
          <a href="unit-summary.html" class="btn-summary">📖 단원 요약</a>
          <a href="quiz.html" class="btn-quiz-sm">✏️ 문제 풀기</a>
        </div>
      </div>
      <!-- Unit 2: 완료 -->
      <div class="unit-item">
        <div class="unit-item-head">
          <div class="unit-num">2</div>
          <div class="unit-item-title">식의 계산</div>
          <div class="unit-progress-badge done">100%</div>
        </div>
        <div class="unit-progress-bar"><div class="unit-progress-fill" style="width:100%;background:var(--success);"></div></div>
        <div class="unit-item-btns">
          <a href="unit-summary.html" class="btn-summary">📖 단원 요약</a>
          <a href="quiz.html" class="btn-quiz-sm">✏️ 문제 풀기</a>
        </div>
      </div>
      <!-- Unit 3: 진행 중 (현재 단원) -->
      <div class="unit-item current">
        <div class="unit-item-head">
          <div class="unit-num">3</div>
          <div class="unit-item-title">함수와 그래프</div>
          <div class="unit-progress-badge partial">60%</div>
        </div>
        <div class="unit-progress-bar"><div class="unit-progress-fill" style="width:60%;"></div></div>
        <div class="unit-item-btns">
          <a href="unit-summary.html" class="btn-summary">📖 단원 요약</a>
          <a href="quiz.html" class="btn-quiz-sm">✏️ 문제 풀기</a>
        </div>
      </div>
      <!-- Unit 4: 미진행 -->
      <div class="unit-item">
        <div class="unit-item-head">
          <div class="unit-num">4</div>
          <div class="unit-item-title">일차함수</div>
          <div class="unit-progress-badge todo">0%</div>
        </div>
        <div class="unit-progress-bar"><div class="unit-progress-fill" style="width:0%;"></div></div>
        <div class="unit-item-btns">
          <a href="unit-summary.html" class="btn-summary">📖 단원 요약</a>
          <a href="quiz.html" class="btn-quiz-sm">✏️ 문제 풀기</a>
        </div>
      </div>
      <!-- Unit 5: 미진행 -->
      <div class="unit-item">
        <div class="unit-item-head">
          <div class="unit-num">5</div>
          <div class="unit-item-title">일차방정식</div>
          <div class="unit-progress-badge todo">0%</div>
        </div>
        <div class="unit-progress-bar"><div class="unit-progress-fill" style="width:0%;"></div></div>
        <div class="unit-item-btns">
          <a href="unit-summary.html" class="btn-summary">📖 단원 요약</a>
          <a href="quiz.html" class="btn-quiz-sm">✏️ 문제 풀기</a>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="cta-bar"><button class="cta-btn">학습 시작하기 &rarr;</button></div>
<div class="bottom-nav">
  <a href="dashboard.html" class="nav-item"><div class="nav-icon">🏠</div>홈</a>
  <a href="subjects.html" class="nav-item active"><div class="nav-icon">📚</div>과목</a>
  <a href="quiz.html" class="nav-item"><div class="nav-center-btn">✏️</div><div class="nav-center-label">풀기</div></a>
  <a href="wrong-answers.html" class="nav-item"><div class="nav-icon">📝</div>오답</a>
  <a href="statistics.html" class="nav-item"><div class="nav-icon">📊</div>통계</a>
</div>
</body>
</html>
