<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>과목 목록 — Daily Study</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root {
  --primary: #4555FF; --primary-focus: #3651DC;
  --primary-light: #22B2FF; --secondary: #6366F1; --accent: #F59E0B;
  --gradient: linear-gradient(90deg, #22B2FF, #4555FF);
  --gradient-bg: linear-gradient(to right, #FFFFFF 0%, #E4F1FF 100%);
  --dark: #0B1026;
  --base-100: #FFFFFF; --base-200: #F2F3F6; --base-300: #E5E7EB;
  --base-content: #1B1B20; --text-secondary: #6B7280;
  --success: #22C55E; --error: #EF4444; --warning: #F59E0B; --info: #3B82F6;
  --card-bg: #FFFFFF; --card-radius: 16px;
  --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
  --card-shadow-hover: 0 4px 16px rgba(69,85,255,0.15);
  --btn-radius: 16px; --btn-shadow: 0 4px 12px rgba(69,85,255,0.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: var(--base-200); color: var(--base-content); padding-bottom: 140px; }
.header { position: sticky; top: 0; z-index: 50; height: 56px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--base-200); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
.header-left { display: flex; align-items: center; gap: 8px; }
.header-logo { width: 28px; height: 28px; background: var(--gradient); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.header-title { font-size: 18px; font-weight: 700; }
.header-right { display: flex; align-items: center; gap: 12px; }
.header-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--base-200); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.header-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--secondary); color: #FFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.content { max-width: 1024px; margin: 0 auto; padding: 16px; }
.page-title { font-size: 24px; font-weight: 700; margin-bottom: 16px; }
.filter-label { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.filter-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 24px; }
.filter-chip { padding: 8px 16px; border: 2px solid var(--base-300); border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; background: var(--base-100); transition: all 0.2s; }
.filter-chip.selected { border-color: var(--primary); background: var(--primary); color: #FFF; }
.subject-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
.subject-card { background: var(--base-100); border-radius: 16px; padding: 16px; box-shadow: var(--card-shadow); display: flex; gap: 16px; align-items: flex-start; text-decoration: none; color: inherit; transition: box-shadow 0.2s, transform 0.2s; }
.subject-card:hover { box-shadow: var(--card-shadow-hover); transform: translateY(-2px); }
.subject-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
.subject-info { flex: 1; }
.subject-name { font-size: 18px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.subject-percent { font-size: 18px; font-weight: 700; }
.subject-grade { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.subject-units { font-size: 13px; color: var(--text-secondary); margin-top: 8px; }
.progress-bar { height: 6px; background: var(--base-200); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.progress-fill { height: 100%; border-radius: 3px; }
.subject-recent { font-size: 12px; color: #9CA3AF; margin-top: 8px; }
.subject-arrow { font-size: 20px; color: var(--base-300); align-self: center; flex-shrink: 0; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: var(--base-100); border-top: 1px solid var(--base-200); display: flex; align-items: center; justify-content: space-around; z-index: 50; max-width: 480px; margin: 0 auto; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: #9CA3AF; cursor: pointer; flex: 1; text-decoration: none; }
.nav-item.active { color: var(--primary); }
.nav-icon { font-size: 20px; }
.nav-center-btn { width: 52px; height: 52px; background: var(--gradient); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #FFF; margin-top: -20px; box-shadow: var(--btn-shadow); }
.nav-center-label { font-size: 11px; color: var(--primary); font-weight: 600; margin-top: 2px; }
@media (min-width: 768px) {
  .subject-grid { grid-template-columns: 1fr 1fr; }
}
@media (min-width: 1024px) {
  .subject-grid { grid-template-columns: repeat(3, 1fr); }
  .bottom-nav { display: none; }
  body { padding-bottom: 0; }
  .content { padding: 32px; }
}

/* CTA Bar */
.cta-bar { position: fixed; bottom: 64px; left: 0; right: 0; z-index: 60; padding: 10px 16px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-top: 1px solid var(--base-200); max-width: 480px; margin: 0 auto; box-shadow: 0 -2px 8px rgba(0,0,0,0.04); }
.cta-btn { width: 100%; padding: 14px; background: var(--gradient); color: #FFF; border: none; border-radius: var(--btn-radius); font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: var(--btn-shadow); transition: opacity 0.2s; }
.cta-btn:hover { opacity: 0.9; }
</style>
</head>
<body>

      <div class="subject-info">
        <div class="subject-name">사회 <span class="subject-percent" style="color:#F59E0B;">30%</span></div>
