<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문제 풀이 — Daily Study</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root {
  --primary: #4555FF; --primary-focus: #3651DC;
  --primary-light: #22B2FF; --secondary: #6366F1; --accent: #F59E0B;
  --gradient: linear-gradient(90deg, #22B2FF, #4555FF);
  --gradient-bg: linear-gradient(to right, #FFFFFF 0%, #E4F1FF 100%);
  --dark: #0B1026;
  --base-100: #FFFFFF; --base-200: #F2F3F6; --base-300: #E5E7EB;
  --base-content: #1B1B20; --text-secondary: #6B7280;
  --success: #22C55E; --error: #EF4444; --warning: #F59E0B; --info: #3B82F6;
  --card-bg: #FFFFFF; --card-radius: 16px;
  --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
  --card-shadow-hover: 0 4px 16px rgba(69,85,255,0.15);
  --btn-radius: 16px; --btn-shadow: 0 4px 12px rgba(69,85,255,0.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: var(--base-200); color: var(--base-content); padding-bottom: 140px; }
.header { position: sticky; top: 0; z-index: 50; height: 56px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--base-200); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
.header-left { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; }
.header-back { width: 36px; height: 36px; border: none; background: transparent; cursor: pointer; font-size: 18px; text-decoration: none; color: inherit; }
.header-timer { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; color: var(--accent); }
.content { max-width: 720px; margin: 0 auto; padding: 16px; }
/* Quiz Session */
.quiz-progress-bar { background: var(--base-100); border-radius: 12px; padding: 12px 16px; box-shadow: var(--card-shadow); margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
.progress-track { flex: 1; height: 8px; background: var(--base-200); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--primary); border-radius: 4px; }
.progress-text { font-size: 14px; font-weight: 600; white-space: nowrap; }
.quiz-breadcrumb { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
.quiz-meta { display: flex; gap: 12px; font-size: 12px; color: #9CA3AF; margin-bottom: 16px; }
.quiz-meta .tag { padding: 3px 10px; border-radius: 999px; font-weight: 600; }
.tag-difficulty { background: rgba(245,158,11,0.1); color: var(--accent); }
.tag-source { background: rgba(34,197,94,0.1); color: var(--success); }
.quiz-card { background: var(--base-100); border-radius: 16px; padding: 24px; box-shadow: var(--card-shadow); margin-bottom: 16px; }
.quiz-question-num { font-size: 14px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
.quiz-question { font-size: 18px; font-weight: 600; margin-bottom: 20px; line-height: 1.5; }
.quiz-option { padding: 14px 16px; border: 2px solid var(--base-300); border-radius: 12px; margin-bottom: 10px; font-size: 15px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 12px; }
.quiz-option:hover { border-color: var(--primary); }
.quiz-option.selected { border-color: var(--primary); background: rgba(69,85,255,0.05); font-weight: 600; }
.option-num { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--base-300); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
.quiz-option.selected .option-num { border-color: var(--primary); background: var(--primary); color: #FFF; }
.quiz-nav { display: flex; gap: 12px; }
.btn-ghost { padding: 12px 24px; border: 2px solid var(--base-300); border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; background: var(--base-100); flex: 1; }
.btn-submit { padding: 12px 24px; background: var(--gradient); color: #FFF; border: none; border-radius: var(--btn-radius); box-shadow: var(--btn-shadow); font-size: 15px; font-weight: 600; cursor: pointer; flex: 1; }
.quiz-info-note { background: rgba(34,197,94,0.05); border: 1px solid rgba(34,197,94,0.2); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; color: var(--success); display: flex; align-items: center; gap: 8px; }
/* Bottom Nav */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: var(--base-100); border-top: 1px solid var(--base-200); display: flex; align-items: center; justify-content: space-around; z-index: 50; max-width: 480px; margin: 0 auto; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: #9CA3AF; cursor: pointer; flex: 1; text-decoration: none; }
.nav-icon { font-size: 20px; }
.nav-center-btn { width: 52px; height: 52px; background: var(--gradient); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #FFF; margin-top: -20px; box-shadow: var(--btn-shadow); }
.nav-center-label { font-size: 11px; color: var(--primary); font-weight: 600; margin-top: 2px; }
@media (min-width: 1024px) { .bottom-nav { display: none; } body { padding-bottom: 0; } .content { padding: 32px; } }

/* CTA Bar */
.cta-bar { position: fixed; bottom: 64px; left: 0; right: 0; z-index: 60; padding: 10px 16px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-top: 1px solid var(--base-200); max-width: 480px; margin: 0 auto; box-shadow: 0 -2px 8px rgba(0,0,0,0.04); }
.cta-btn { width: 100%; padding: 14px; background: var(--gradient); color: #FFF; border: none; border-radius: var(--btn-radius); font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: var(--btn-shadow); transition: opacity 0.2s; }
.cta-btn:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="header">
  <div class="header-left"><a href="unit-summary.html" class="header-back">←</a> 문제 풀기</div>
  <div class="header-timer">⏱️ 04:32</div>
</div>
<div class="content">
  <!-- 승인된 문제 풀에서 즉시 제공 -->
  <div class="quiz-info-note">
    ✅ 승인된 문제 풀에서 제공됩니다. 즉시 풀이 시작!
  </div>

  <div class="quiz-progress-bar">
    <div class="progress-text">Q3 / 10</div>
    <div class="progress-track"><div class="progress-fill" style="width:30%;"></div></div>
    <div class="progress-text">30%</div>
  </div>

  <div class="quiz-breadcrumb">수학 > 함수와 그래프</div>
  <div class="quiz-meta">
    <span class="tag tag-difficulty">난이도 ⭐⭐ (보통)</span>
    <span class="tag tag-source">승인된 풀</span>
  </div>

  <div class="quiz-card">
    <div class="quiz-question-num">문제 3</div>
    <div class="quiz-question">다음 중 함수가 아닌 것은?</div>
    <div class="quiz-option">
      <div class="option-num">①</div>
      <div>y = 2x + 1</div>
    </div>
    <div class="quiz-option selected">
      <div class="option-num">②</div>
      <div>y² = x</div>
    </div>
    <div class="quiz-option">
      <div class="option-num">③</div>
      <div>y = x²</div>
    </div>
    <div class="quiz-option">
      <div class="option-num">④</div>
      <div>y = |x|</div>
    </div>
  </div>

  <div class="quiz-nav">
    <button class="btn-ghost">이전 문제</button>
    <button class="btn-submit">제출하기</button>
  </div>
</div>

<div class="cta-bar"><button class="cta-btn">학습 시작하기 →</button></div>
<div class="bottom-nav">
  <a href="dashboard.html" class="nav-item"><div class="nav-icon">🏠</div>홈</a>
  <a href="subjects.html" class="nav-item"><div class="nav-icon">📚</div>과목</a>
  <a href="quiz.html" class="nav-item"><div class="nav-center-btn">✏️</div><div class="nav-center-label">풀기</div></a>
  <a href="wrong-answers.html" class="nav-item"><div class="nav-icon">📝</div>오답</a>
  <a href="statistics.html" class="nav-item"><div class="nav-icon">📊</div>통계</a>
</div>
</body>
</html>
