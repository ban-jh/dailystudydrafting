<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학습 통계 — Daily Study</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root {
  --primary: #4555FF; --primary-focus: #3651DC;
  --primary-light: #22B2FF; --secondary: #6366F1; --accent: #F59E0B;
  --gradient: linear-gradient(90deg, #22B2FF, #4555FF);
  --gradient-bg: linear-gradient(to right, #FFFFFF 0%, #E4F1FF 100%);
  --dark: #0B1026;
  --base-100: #FFFFFF; --base-200: #F2F3F6; --base-300: #E5E7EB;
  --base-content: #1B1B20; --text-secondary: #6B7280;
  --success: #22C55E; --error: #EF4444; --warning: #F59E0B; --info: #3B82F6;
  --card-bg: #FFFFFF; --card-radius: 16px;
  --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
  --card-shadow-hover: 0 4px 16px rgba(69,85,255,0.15);
  --btn-radius: 16px; --btn-shadow: 0 4px 12px rgba(69,85,255,0.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: var(--base-200); color: var(--base-content); padding-bottom: 140px; }
.header { position: sticky; top: 0; z-index: 50; height: 56px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--base-200); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
.header-left { display: flex; align-items: center; gap: 8px; }
.header-logo { width: 28px; height: 28px; background: var(--gradient); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.header-title { font-size: 18px; font-weight: 700; }
.header-right { display: flex; align-items: center; gap: 12px; }
.header-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--base-200); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.header-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--secondary); color: #FFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
.content { max-width: 1024px; margin: 0 auto; padding: 16px; }
.page-title { font-size: 24px; font-weight: 700; margin-bottom: 16px; }
/* Period Filter */
.filter-chips { display: flex; gap: 8px; margin-bottom: 24px; }
.chip { padding: 8px 16px; border: 2px solid var(--base-300); border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; background: var(--base-100); transition: all 0.2s; }
.chip.selected { border-color: var(--primary); background: var(--primary); color: #FFF; }
/* Summary Stats */
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
.stat-card { background: var(--base-100); border-radius: 16px; padding: 20px; box-shadow: var(--card-shadow); text-align: center; }
.stat-num { font-size: 28px; font-weight: 700; }
.stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
/* Chart Cards */
.chart-card { background: var(--base-100); border-radius: 16px; padding: 20px; box-shadow: var(--card-shadow); margin-bottom: 16px; }
.chart-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
/* Line Chart (CSS) */
.line-chart { height: 180px; position: relative; padding: 20px 0 28px 0; }
.line-chart svg { width: 100%; height: 100%; }
.chart-x-labels { display: flex; justify-content: space-between; padding: 0 8px; font-size: 11px; color: #9CA3AF; }
/* Horizontal Bar Chart */
.bar-chart { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: flex; align-items: center; gap: 12px; }
.bar-label { width: 40px; font-size: 14px; font-weight: 600; text-align: right; }
.bar-track { flex: 1; height: 24px; background: var(--base-200); border-radius: 12px; overflow: hidden; position: relative; }
.bar-fill { height: 100%; border-radius: 12px; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; font-size: 12px; font-weight: 700; color: #FFF; transition: width 1s ease; }
.bar-value { font-size: 13px; font-weight: 600; min-width: 36px; }
/* Donut Chart */
.donut-container { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; justify-content: center; }
.donut {
  width: 180px; height: 180px; border-radius: 50%; position: relative;
  background: conic-gradient(
    #3B82F6 0deg 126deg,
    #10B981 126deg 216deg,
    #F43F5E 216deg 288deg,
    #6366F1 288deg 342deg,
    #F59E0B 342deg 360deg
  );
}
.donut::after {
  content: '12.4h'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 110px; height: 110px; background: var(--base-100); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700;
}
.donut-legend { display: flex; flex-direction: column; gap: 8px; }
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.legend-dot { width: 12px; height: 12px; border-radius: 4px; }
/* Heatmap */
.heatmap { display: flex; flex-direction: column; gap: 4px; }
.heatmap-row { display: flex; gap: 4px; }
.heatmap-cell { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--base-content); }
.heatmap-header { display: flex; gap: 4px; margin-bottom: 4px; }
.heatmap-header-cell { width: 32px; text-align: center; font-size: 11px; color: #9CA3AF; }
.l0 { background: var(--base-200); }
.l1 { background: rgba(69,85,255,0.2); }
.l2 { background: rgba(69,85,255,0.4); }
.l3 { background: rgba(69,85,255,0.6); }
.l4 { background: var(--primary); }
.heatmap-legend { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 12px; color: #9CA3AF; }
.heatmap-legend-cells { display: flex; gap: 3px; }
.heatmap-legend-cell { width: 14px; height: 14px; border-radius: 3px; }
/* Bottom Nav */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: var(--base-100); border-top: 1px solid var(--base-200); display: flex; align-items: center; justify-content: space-around; z-index: 50; max-width: 480px; margin: 0 auto; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: #9CA3AF; cursor: pointer; flex: 1; text-decoration: none; }
.nav-item.active { color: var(--primary); }
.nav-icon { font-size: 20px; }
.nav-center-btn { width: 52px; height: 52px; background: var(--gradient); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #FFF; margin-top: -20px; box-shadow: var(--btn-shadow); }
.nav-center-label { font-size: 11px; color: var(--primary); font-weight: 600; margin-top: 2px; }
@media (min-width: 768px) {
  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .chart-card.full { grid-column: span 2; }
}
@media (min-width: 1024px) { .bottom-nav { display: none; } body { padding-bottom: 0; } .content { padding: 32px; } }

/* Dark Section */
.dark-section-wrap { background: var(--dark); border-radius: 20px; padding: 24px; margin-bottom: 24px; }
.dark-section-wrap .section-title { color: #FFF; }
.dark-section-wrap .stat-card { background: rgba(255,255,255,0.08); box-shadow: none; }
.dark-section-wrap .stat-label { color: rgba(255,255,255,0.6); }
.dark-section-wrap .stat-num { color: var(--primary-light) !important; }

/* CTA Bar */
.cta-bar { position: fixed; bottom: 64px; left: 0; right: 0; z-index: 60; padding: 10px 16px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-top: 1px solid var(--base-200); max-width: 480px; margin: 0 auto; box-shadow: 0 -2px 8px rgba(0,0,0,0.04); }
.cta-btn { width: 100%; padding: 14px; background: var(--gradient); color: #FFF; border: none; border-radius: var(--btn-radius); font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: var(--btn-shadow); transition: opacity 0.2s; }
.cta-btn:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="header">
  <div class="header-left"><a href="dashboard.html" style="text-decoration:none;color:inherit;font-size:18px;font-weight:600;">← 학습 통계</a></div>
  <div class="header-right"><button class="header-btn">🔔</button><a href="mypage.html" class="header-avatar" style="text-decoration:none;color:#FFF;">민</a></div>
</div>
<div class="content">
  <div class="page-title">학습 통계</div>
  <div class="filter-chips">
    <div class="chip selected">주간</div>
    <div class="chip">월간</div>
    <div class="chip">학기</div>
    <div class="chip">전체</div>
  </div>
  <!-- Summary (Dark Section) -->
  <div class="dark-section-wrap">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num" style="color:var(--primary-light);">47</div><div class="stat-label">푼 문제</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--primary-light);">82%</div><div class="stat-label">정답률</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--primary-light);">12.4h</div><div class="stat-label">학습 시간</div></div>
    </div>
  </div>
  <div class="charts-grid">
    <!-- Line Chart -->
    <div class="chart-card">
      <div class="chart-title">📈 학습 시간 추이</div>
      <div class="line-chart">
        <svg viewBox="0 0 300 140" preserveAspectRatio="none">
          <polyline points="10,100 55,70 100,80 145,50 190,60 235,30 280,45" fill="none" stroke="#4555FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="10,100 55,70 100,80 145,50 190,60 235,30 280,45 280,140 10,140" fill="rgba(69,85,255,0.1)" stroke="none"/>
          <circle cx="10" cy="100" r="4" fill="#4555FF"/>
          <circle cx="55" cy="70" r="4" fill="#4555FF"/>
          <circle cx="100" cy="80" r="4" fill="#4555FF"/>
          <circle cx="145" cy="50" r="4" fill="#4555FF"/>
          <circle cx="190" cy="60" r="4" fill="#4555FF"/>
          <circle cx="235" cy="30" r="4" fill="#4555FF"/>
          <circle cx="280" cy="45" r="4" fill="#4555FF"/>
        </svg>
      </div>
      <div class="chart-x-labels"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div>
    </div>
    <!-- Donut Chart -->
    <div class="chart-card">
      <div class="chart-title">🍩 과목별 학습 비율</div>
      <div class="donut-container">
        <div class="donut"></div>
        <div class="donut-legend">
          <div class="legend-item"><div class="legend-dot" style="background:#3B82F6;"></div>수학 35%</div>
          <div class="legend-item"><div class="legend-dot" style="background:#10B981;"></div>과학 25%</div>
          <div class="legend-item"><div class="legend-dot" style="background:#F43F5E;"></div>국어 20%</div>
          <div class="legend-item"><div class="legend-dot" style="background:#6366F1;"></div>영어 15%</div>
          <div class="legend-item"><div class="legend-dot" style="background:#F59E0B;"></div>사회 5%</div>
        </div>
      </div>
    </div>
    <!-- Bar Chart -->
    <div class="chart-card full">
      <div class="chart-title">📊 과목별 정답률</div>
      <div class="bar-chart">
        <div class="bar-row">
          <div class="bar-label" style="color:#F43F5E;">국어</div>
          <div class="bar-track"><div class="bar-fill" style="width:90%;background:#F43F5E;">90%</div></div>
        </div>
        <div class="bar-row">
          <div class="bar-label" style="color:#3B82F6;">수학</div>
          <div class="bar-track"><div class="bar-fill" style="width:80%;background:#3B82F6;">80%</div></div>
        </div>
        <div class="bar-row">
          <div class="bar-label" style="color:#6366F1;">영어</div>
          <div class="bar-track"><div class="bar-fill" style="width:70%;background:#6366F1;">70%</div></div>
        </div>
        <div class="bar-row">
          <div class="bar-label" style="color:#10B981;">과학</div>
          <div class="bar-track"><div class="bar-fill" style="width:60%;background:#10B981;">60%</div></div>
        </div>
        <div class="bar-row">
          <div class="bar-label" style="color:#F59E0B;">사회</div>
          <div class="bar-track"><div class="bar-fill" style="width:50%;background:#F59E0B;">50%</div></div>
        </div>
        <div class="bar-row">
          <div class="bar-label" style="color:#92400E;">역사</div>
          <div class="bar-track"><div class="bar-fill" style="width:40%;background:#92400E;">40%</div></div>
        </div>
      </div>
    </div>
    <!-- Heatmap -->
    <div class="chart-card full">
      <div class="chart-title">📅 일별 학습 달력 (11월)</div>
      <div class="heatmap-header">
        <div class="heatmap-header-cell">일</div><div class="heatmap-header-cell">월</div><div class="heatmap-header-cell">화</div><div class="heatmap-header-cell">수</div><div class="heatmap-header-cell">목</div><div class="heatmap-header-cell">금</div><div class="heatmap-header-cell">토</div>
      </div>
      <div class="heatmap">
        <div class="heatmap-row">
          <div class="heatmap-cell l0"></div><div class="heatmap-cell l1"></div><div class="heatmap-cell l3"></div><div class="heatmap-cell l4"></div><div class="heatmap-cell l2"></div><div class="heatmap-cell l0"></div><div class="heatmap-cell l0"></div>
        </div>
        <div class="heatmap-row">
          <div class="heatmap-cell l0"></div><div class="heatmap-cell l3"></div><div class="heatmap-cell l4"></div><div class="heatmap-cell l4"></div><div class="heatmap-cell l3"></div><div class="heatmap-cell l4"></div><div class="heatmap-cell l1"></div>
        </div>
        <div class="heatmap-row">
          <div class="heatmap-cell l0"></div><div class="heatmap-cell l2"></div><div class="heatmap-cell l3"></div><div class="heatmap-cell l4"></div><div class="heatmap-cell l2"></div><div class="heatmap-cell l1"></div><div class="heatmap-cell l0"></div>
        </div>
        <div class="heatmap-row">
          <div class="heatmap-cell l0"></div><div class="heatmap-cell l4"></div><div class="heatmap-cell l3"></div><div class="heatmap-cell l2"></div><div class="heatmap-cell l3"></div><div class="heatmap-cell l4"></div><div class="heatmap-cell l2"></div>
        </div>
      </div>
      <div class="heatmap-legend">
        <span>적음</span>
        <div class="heatmap-legend-cells">
          <div class="heatmap-legend-cell l0"></div>
          <div class="heatmap-legend-cell l1"></div>
          <div class="heatmap-legend-cell l2"></div>
          <div class="heatmap-legend-cell l3"></div>
          <div class="heatmap-legend-cell l4"></div>
        </div>
        <span>많음</span>
      </div>
    </div>
  </div>
</div>

<div class="cta-bar"><a href="subjects.html"><button class="cta-btn">학습 계속하기 →</button></a></div>
<div class="bottom-nav">
  <a href="dashboard.html" class="nav-item"><div class="nav-icon">🏠</div>홈</a>
  <a href="subjects.html" class="nav-item"><div class="nav-icon">📚</div>과목</a>
  <a href="quiz.html" class="nav-item"><div class="nav-center-btn">✏️</div><div class="nav-center-label">풀기</div></a>
  <a href="wrong-answers.html" class="nav-item"><div class="nav-icon">📝</div>오답</a>
  <a href="statistics.html" class="nav-item active"><div class="nav-icon">📊</div>통계</a>
</div>
</body>
</html>
