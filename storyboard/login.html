<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 — Daily Study</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root {
  --primary: #4555FF; --primary-focus: #3651DC;
  --primary-light: #22B2FF; --secondary: #6366F1; --accent: #F59E0B;
  --gradient: linear-gradient(90deg, #22B2FF, #4555FF);
  --gradient-bg: linear-gradient(to right, #FFFFFF 0%, #E4F1FF 100%);
  --dark: #0B1026;
  --base-100: #FFFFFF; --base-200: #F2F3F6; --base-300: #E5E7EB;
  --base-content: #1B1B20; --text-secondary: #6B7280;
  --success: #22C55E; --error: #EF4444; --warning: #F59E0B; --info: #3B82F6;
  --card-bg: #FFFFFF; --card-radius: 16px;
  --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
  --card-shadow-hover: 0 4px 16px rgba(69,85,255,0.15);
  --btn-radius: 16px; --btn-shadow: 0 4px 12px rgba(69,85,255,0.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  background: var(--gradient-bg); color: var(--base-content);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.login-container { width: 100%; max-width: 420px; }
.login-card {
  background: var(--base-100); border-radius: 16px; padding: 40px 32px;
  box-shadow: 0 4px 24px rgba(69,85,255,0.12);
}
.logo-area { text-align: center; margin-bottom: 32px; }
.logo-icon {
  width: 56px; height: 56px; background: var(--gradient); border-radius: 16px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 28px; margin-bottom: 12px;
}
.logo-text { font-size: 24px; font-weight: 700; color: var(--base-content); }
.logo-sub { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
.form-group { margin-bottom: 20px; }
.form-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.form-input {
  width: 100%; padding: 12px 16px; border: 2px solid var(--base-300);
  border-radius: 8px; font-size: 16px; font-family: inherit;
  transition: border-color 0.2s; background: var(--base-100);
}
.form-input:focus { outline: none; border-color: var(--primary); }
.form-input::placeholder { color: #9CA3AF; }
.btn-primary {
  width: 100%; padding: 14px; background: var(--gradient); color: #FFF;
  border: none; border-radius: var(--btn-radius); box-shadow: var(--btn-shadow); font-size: 16px; font-weight: 600;
  font-family: inherit; cursor: pointer; transition: opacity 0.2s;
}
.btn-primary:hover { opacity: 0.9; }
.signup-link { text-align: center; margin-top: 32px; font-size: 14px; color: var(--text-secondary); }
.signup-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
@media (min-width: 768px) {
  .login-card { padding: 48px 40px; }
}

/* CTA Bar */
.cta-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 60; padding: 12px 16px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-top: 1px solid var(--base-200); max-width: 480px; margin: 0 auto; box-shadow: 0 -2px 8px rgba(0,0,0,0.04); }
.cta-btn { width: 100%; padding: 14px; background: var(--gradient); color: #FFF; border: none; border-radius: var(--btn-radius); font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: var(--btn-shadow); transition: opacity 0.2s; }
.cta-btn:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="login-container">
  <div class="login-card">
    <div class="logo-area">
      <div class="logo-icon">📚</div>
      <div class="logo-text">Daily Study</div>
      <div class="logo-sub">매일 학습, 성장의 시작</div>
    </div>
    <form>
      <div class="form-group">
        <label class="form-label">이메일</label>
        <input type="email" class="form-input" placeholder="hello@dailystudy.com">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input type="password" class="form-input" placeholder="비밀번호를 입력하세요">
      </div>
      <a href="dashboard.html"><button type="submit" class="btn-primary" style="margin-top: 8px;">로그인</button></a>
    </form>
    <div class="signup-link">
      아직 계정이 없나요? <a href="signup.html">회원가입</a>
    </div>
  </div>
</div>
</body>
</html>
