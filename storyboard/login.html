<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 — Daily Study</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root {
  --primary: #10B981; --primary-focus: #059669;
  --secondary: #6366F1; --accent: #F59E0B;
  --base-100: #FFFFFF; --base-200: #F3F4F6; --base-300: #E5E7EB;
  --base-content: #1F2937; --success: #22C55E; --error: #EF4444;
  --warning: #F59E0B; --info: #3B82F6;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  background: var(--base-200); color: var(--base-content);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.login-container { width: 100%; max-width: 420px; }
.login-card {
  background: var(--base-100); border-radius: 16px; padding: 40px 32px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
}
.logo-area { text-align: center; margin-bottom: 32px; }
.logo-icon {
  width: 56px; height: 56px; background: var(--primary); border-radius: 16px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 28px; margin-bottom: 12px;
}
.logo-text { font-size: 24px; font-weight: 700; color: var(--base-content); }
.logo-sub { font-size: 14px; color: #6B7280; margin-top: 4px; }
.form-group { margin-bottom: 20px; }
.form-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.form-input {
  width: 100%; padding: 12px 16px; border: 2px solid var(--base-300);
  border-radius: 8px; font-size: 16px; font-family: inherit;
  transition: border-color 0.2s; background: var(--base-100);
}
.form-input:focus { outline: none; border-color: var(--primary); }
.form-input::placeholder { color: #9CA3AF; }
.btn-primary {
  width: 100%; padding: 14px; background: var(--primary); color: #FFF;
  border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
  font-family: inherit; cursor: pointer; transition: background 0.2s;
}
.btn-primary:hover { background: var(--primary-focus); }
.divider { display: flex; align-items: center; gap: 12px; margin: 28px 0; color: #9CA3AF; font-size: 13px; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--base-300); }
.social-btn {
  width: 100%; padding: 12px 16px; border: 2px solid var(--base-300);
  border-radius: 12px; font-size: 15px; font-weight: 600; font-family: inherit;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  gap: 10px; background: var(--base-100); margin-bottom: 10px; transition: background 0.2s;
}
.social-btn:hover { background: var(--base-200); }
.social-icon { width: 20px; height: 20px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #FFF; }
.social-google { background: #4285F4; }
.social-kakao { background: #FEE500; color: #3C1E1E; }
.social-naver { background: #03C75A; }
.signup-link { text-align: center; margin-top: 24px; font-size: 14px; color: #6B7280; }
.signup-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
@media (min-width: 768px) {
  .login-card { padding: 48px 40px; }
}
</style>
</head>
<body>
<div class="login-container">
  <div class="login-card">
    <div class="logo-area">
      <div class="logo-icon">📚</div>
      <div class="logo-text">Daily Study</div>
      <div class="logo-sub">매일 학습, 성장의 시작</div>
    </div>
    <form>
      <div class="form-group">
        <label class="form-label">이메일</label>
        <input type="email" class="form-input" placeholder="hello@dailystudy.com">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input type="password" class="form-input" placeholder="비밀번호를 입력하세요">
      </div>
      <button type="submit" class="btn-primary" style="margin-top: 8px;">로그인</button>
    </form>
    <div class="divider">또는</div>
    <button class="social-btn">
      <span class="social-icon social-google">G</span>
      Google로 시작하기
    </button>
    <button class="social-btn">
      <span class="social-icon social-kakao">K</span>
      카카오로 시작하기
    </button>
    <button class="social-btn">
      <span class="social-icon social-naver">N</span>
      네이버로 시작하기
    </button>
    <div class="signup-link">
      아직 계정이 없나요? <a href="signup.html">회원가입</a>
    </div>
  </div>
</div>
</body>
</html>
