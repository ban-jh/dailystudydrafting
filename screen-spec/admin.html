@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
:root{--blue:#4555ff;--sky:#22b2ff;--ink:#1a1a2e;--muted:#68738b;--line:#e0e6f0;--soft:#f6f8fd;--green:#12a878;--amber:#e89a16;--red:#e45a67}
*{box-sizing:border-box}body{margin:0;background:#eef1f6;color:var(--ink);font-family:Pretendard,-apple-system,sans-serif;line-height:1.55}.page{max-width:1440px;margin:auto;background:#fff;min-height:100vh}.topbar{padding:14px 30px;background:linear-gradient(90deg,var(--sky),var(--blue));color:white;display:flex;justify-content:space-between;align-items:center;font-weight:700}.topbar small{font-weight:500;opacity:.9}.meta{display:grid;grid-template-columns:repeat(4,1fr);background:#f8faff;border-bottom:2px solid var(--blue)}.meta div{padding:10px 20px;border-right:1px solid var(--line)}.meta label{display:block;color:#8899bb;font-size:11px;font-weight:700}.meta strong{font-size:14px}.tabs{display:flex;gap:8px;padding:14px 22px;overflow:auto;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 13px;color:#536078;font-weight:600;cursor:pointer}.tabs button.active,.tabs button:hover{color:var(--blue);border-color:var(--blue);background:#f2f4ff}.intro{padding:22px 30px 6px}.intro h1{font-size:23px;margin:0 0 5px}.intro p{margin:0;color:var(--muted);font-size:14px}.sheet{display:none;padding:18px 24px 35px}.sheet.active{display:block}.sheet-head{display:flex;gap:0;border:1px solid var(--line);background:#f8faff;margin-bottom:16px}.sheet-head div{padding:10px 14px;border-right:1px solid var(--line);flex:1}.sheet-head div:last-child{border:0}.sheet-head label{display:block;color:#8899bb;font-size:10px;font-weight:700}.sheet-head strong{font-size:13px}.split{display:grid;grid-template-columns:minmax(500px,1.08fr) minmax(360px,.92fr);border:1px solid var(--line);min-height:590px}.canvas{background:#fafbff;padding:22px;border-right:1px solid var(--line)}.events{padding:22px 25px}.section-title{font-size:13px;color:var(--blue);font-weight:800;padding-bottom:9px;margin:0 0 15px;border-bottom:1px solid var(--line)}.mock{background:#fff;border:1px solid #d8deeb;border-radius:10px;box-shadow:0 4px 18px #1a1a2e0b;overflow:hidden}.mock-top{height:42px;background:#f8faff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:12px;font-weight:700}.mock-top em{font-style:normal;color:var(--muted);font-weight:500}.app{display:grid;grid-template-columns:138px 1fr;min-height:495px}.side{background:#f7f8fc;border-right:1px solid var(--line);padding:13px 9px}.brand{font-size:12px;font-weight:800;color:var(--blue);padding:0 7px 12px}.side span{display:block;padding:7px 8px;border-radius:5px;font-size:10px;color:#637089;margin:2px 0}.side span.on{background:#e9ecff;color:var(--blue);font-weight:700}.workspace{padding:18px 18px 22px;min-width:0}.crumb{font-size:9px;color:#8993a7;margin-bottom:8px}.title{font-size:17px;font-weight:800;margin:0 0 4px}.sub{font-size:10px;color:var(--muted);margin:0 0 14px}.toolbar{display:flex;gap:6px;align-items:center;margin:10px 0;flex-wrap:wrap}.field,.select,.search{background:white;border:1px solid #dbe1ec;border-radius:5px;padding:7px 8px;font-size:9px;color:#4c5870;min-width:80px}.search{flex:1;min-width:110px}.btn{border:0;border-radius:5px;padding:8px 11px;background:var(--blue);color:white;font-size:9px;font-weight:700;white-space:nowrap}.btn.light{background:#eef0ff;color:var(--blue)}.btn.outline{background:#fff;color:#536078;border:1px solid var(--line)}.btn.warn{background:#fff2df;color:#ad6a00}.btn.red{background:#fff0f1;color:#bf3444}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stat{border:1px solid var(--line);border-radius:7px;padding:10px;background:#fff}.stat label{font-size:9px;color:var(--muted);display:block}.stat strong{font-size:18px}.stat small{font-size:8px;color:var(--muted);display:block}.table{width:100%;border-collapse:collapse;font-size:9px;background:#fff}.table th{background:#f4f6fb;color:#68738b;text-align:left;font-weight:700}.table th,.table td{padding:8px 7px;border-bottom:1px solid #e9edf4;vertical-align:middle}.table td:first-child,.table th:first-child{width:24px}.tag{display:inline-block;border-radius:10px;padding:2px 7px;background:#eef0ff;color:var(--blue);font-size:8px;white-space:nowrap}.tag.green{background:#e7f7f0;color:#09835b}.tag.amber{background:#fff3df;color:#ad6a00}.tag.red{background:#fff0f1;color:#bf3444}.card{border:1px solid var(--line);border-radius:7px;padding:11px;margin:8px 0;background:#fff}.card h4{font-size:11px;margin:0 0 7px}.card p{font-size:9px;color:var(--muted);margin:4px 0}.row{display:flex;gap:8px}.row>*{flex:1}.tree{border:1px solid var(--line);border-radius:6px;padding:8px;background:white;font-size:9px}.tree div{padding:6px;border-bottom:1px solid #edf0f5}.tree div:last-child{border:0}.tree .indent{padding-left:20px}.tree .skip{color:#9a6a13;background:#fff8ea}.progress{height:7px;background:#e7eaf1;border-radius:10px;margin-top:6px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--blue));border-radius:10px}.note{font-size:8px;color:#8a94a8;margin-top:10px}.event{display:grid;grid-template-columns:28px 1fr;gap:8px;margin:0 0 17px}.num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--sky),var(--blue));color:white;font-size:12px;font-weight:800}.event h3{font-size:12px;margin:1px 0 4px}.event p,.event li{font-size:11px;color:#59647a;line-height:1.65;margin:0}.event ul{padding-left:15px;margin:4px 0}.legend{display:flex;gap:7px;flex-wrap:wrap;font-size:9px;color:var(--muted);margin-top:12px}.legend span{padding:4px 8px;border:1px solid var(--line);border-radius:12px;background:white}.footer{text-align:center;padding:14px;color:#8899bb;background:#f8faff;border-top:1px solid var(--line);font-size:11px}.hidden{display:none!important}
@media(max-width:900px){.split{grid-template-columns:1fr}.canvas{border-right:0;border-bottom:1px solid var(--line)}.meta{grid-template-columns:repeat(2,1fr)}.app{grid-template-columns:105px 1fr}.side span{font-size:9px}.sheet{padding:12px}.canvas,.events{padding:15px}}
@media print{body{background:#fff}.page{max-width:none}.tabs{display:none}.sheet{display:block!important;break-after:page}.split{min-height:650px}.topbar{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style>

<div class="page">
<div class="topbar"><span>Daily Study · 관리자 화면설계서 <small>학교별 교육과정 · 콘텐츠 · 단원 일정 · 개인 진도</small></span><small>화면 ID 기준 v1.0</small></div>
<div class="meta"><div><label>시스템</label><strong>Daily Study</strong></div><div><label>대상 사용자</label><strong>관리자 (ADMIN)</strong></div><div><label>화면 유형</label><strong>반응형 웹 · 데스크톱 우선</strong></div><div><label>설계 기준</label><strong>이마트 화면설계서 형식 준용</strong></div></div>
<div class="intro"><h1>화면설계서</h1><p>관리자가 학교·학년별 교과서를 구성하고 학습 자료를 승인·편성해 단원별 일정을 운영하는 화면 명세입니다. 각 화면의 왼쪽은 와이어프레임, 오른쪽은 번호별 역할과 동작 설명입니다.</p></div>
<nav class="tabs" id="tabs"></nav>
<main id="sheets"></main>
<div class="footer">Daily Study · 관리자 화면설계서 · 2026-11-04</div>
</div>
<script>
const screens=[
{id:'ADM-01',name:'운영 대시보드',path:'/admin/dashboard',role:'당일 운영 현황 확인',description:'검수 대기와 오늘 공개할 단원 일정, 학생별 진행 상태를 한 화면에서 파악합니다.',nav:'운영 대시보드',events:[['요약 지표','검수 대기, 오늘 일정, 학습 시작자, 완료율을 집계해 보여줍니다. 숫자를 선택하면 해당 조건이 적용된 목록으로 이동합니다.'],['오늘 일정','과목·단원·대상·공개 상태를 카드로 표시합니다. 미편성이나 미승인 자료가 포함된 일정은 경고합니다.'],['운영 작업','콘텐츠 생성, 검수 대기, 일정 편성으로 바로 이동하는 빠른 작업입니다.'],['학생 진행률','오늘 일정 기준 미시작·진행 중·완료 학생 수와 과목별 완료율을 보여줍니다.']],body:`<div class="grid"><div class="stat"><label>검수 대기</label><strong>12</strong><small>자료 확인 필요</small></div><div class="stat"><label>오늘 단원 일정</label><strong>8</strong><small>중학교·고등학교</small></div><div class="stat"><label>오늘 학습 완료</label><strong>68%</strong><small>142 / 208명</small></div></div><div class="toolbar"><button class="btn">+ 콘텐츠 생성</button><button class="btn light">검수 대기 보기</button><button class="btn outline">일정 편성</button></div><h4 style="font-size:11px">오늘 공개 일정</h4><table class="table"><thead><tr><th>과목·단원</th><th>학교/학년</th><th>대상</th><th>진행</th><th>상태</th></tr></thead><tbody><tr><td>수학 · 일차함수</td><td>한빛중 2학년</td><td>24명</td><td>18/24</td><td><span class="tag green">진행 중</span></td></tr><tr><td>영어 · 현재완료</td><td>한빛중 3학년</td><td>21명</td><td>21/21</td><td><span class="tag green">완료</span></td></tr><tr><td>과학 · 힘과 운동</td><td>새봄고 1학년</td><td>32명</td><td>0/32</td><td><span class="tag amber">예약</span></td></tr></tbody></table><div class="card"><h4>운영 알림</h4><p>검수 대기 3건이 2일 이상 대기 중입니다.</p><p>내일 일정에 단원 콘텐츠가 지정되지 않은 항목이 있습니다.</p></div>`},
{id:'ADM-02',name:'학교·학년별 교육과정',path:'/admin/curriculum',role:'학교·교과서 체계 관리',description:'학교급, 학교, 학년, 적용 연도별 과목과 교과서 출판사·단원 구조를 편성합니다.',nav:'학교·교육과정',events:[['검색 조건','학교급, 학교명, 학년, 적용 연도를 선택해 편성을 조회합니다. 중학교와 고등학교의 학년 범위를 구분합니다.'],['학교 편성','학교/학년별 개설 과목을 등록하거나 편성표를 복사해 새 학년도 설정을 만듭니다.'],['출판사·판본','과목별 출판사, 교과서명, 판본과 필요 시 ISBN을 연결합니다. 과목명이 같아도 출판사별 단원 체계는 독립 관리합니다.'],['단원 구조','교과서의 대단원·소단원 순서와 공통 학습 목표 매핑을 관리합니다. 미매핑/중복 단원을 경고합니다.'],['적용 및 이력','미리보기 후 적용하고 변경자·적용일·변경 전후를 이력으로 남깁니다. 사용 중 설정은 삭제 대신 종료 처리합니다.']],body:`<div class="toolbar"><div class="select">학교급: 중학교 ▾</div><div class="select">학교: 한빛중학교 ▾</div><div class="select">학년: 2학년 ▾</div><div class="select">적용 연도: 2026 ▾</div><button class="btn">편성 불러오기</button></div><div class="row"><div class="card"><h4>학교 정보</h4><p>한빛중학교 · 중학교</p><p>적용 기간: 2026학년도</p><p>상태: <span class="tag green">적용 중</span></p></div><div class="card"><h4>편성 현황</h4><p>과목 7개 · 출판사 연결 7/7</p><p>단원 매핑 완료 42/45</p><p><span class="tag amber">매핑 확인 3건</span></p></div></div><div class="toolbar"><input class="search" placeholder="과목 또는 출판사 검색"><button class="btn light">+ 과목 추가</button><button class="btn outline">변경 이력</button></div><table class="table"><thead><tr><th>과목</th><th>학년</th><th>출판사</th><th>교과서/판본</th><th>단원</th><th>상태</th></tr></thead><tbody><tr><td>수학</td><td>2학년</td><td>미래교육</td><td>중학 수학 2 (2026)</td><td>12단원</td><td><span class="tag green">적용 중</span></td></tr><tr><td>영어</td><td>2학년</td><td>한빛출판</td><td>중학 영어 2 (개정판)</td><td>8단원</td><td><span class="tag green">적용 중</span></td></tr><tr><td>과학</td><td>2학년</td><td>새길교육</td><td>중학 과학 2</td><td>9단원</td><td><span class="tag amber">매핑 확인</span></td></tr></tbody></table><div class="toolbar"><button class="btn outline">임시 저장</button><button class="btn">편성 미리보기 후 적용</button></div>`},
{id:'ADM-03',name:'학습 콘텐츠 생성',path:'/admin/contents/create',role:'AI·크롤링·직접 입력으로 초안 생성',description:'학교별 과목과 단원에 맞는 요약 및 문제를 생성하고 검수 대기 상태로 저장합니다.',nav:'콘텐츠 생성',events:[['교육과정 선택','학교/학년·적용 연도·과목·출판사·단원을 지정합니다. 대상 단원 선택 시 교과서 판본을 함께 표시합니다.'],['생성 방식','AI 생성, 허용 소스 크롤링, 직접 입력/파일 등록 중 방식을 선택합니다.'],['학습 목표와 산출물','요약·문제·둘 다를 지정하고 목표, 난이도, 문항 수, 문제 유형을 설정합니다.'],['초안 결과','생성 내용과 출처를 미리 보고 수정·제외·재생성합니다. 정답, 보기, 해설 누락을 검증합니다.'],['검수 요청','저장된 초안은 학생에게 보이지 않습니다. 검수 요청 시 상태를 검수 대기로 바꿉니다.']],body:`<div class="toolbar"><div class="select">중학교 · 2학년 ▾</div><div class="select">한빛중 · 2026 ▾</div></div><div class="toolbar"><div class="select">수학 ▾</div><div class="select">미래교육 교과서 ▾</div><div class="select">3단원 · 일차함수 ▾</div></div><h4 style="font-size:11px">생성 방식 선택</h4><div class="grid"><div class="card"><h4>✨ AI 생성</h4><p>요약 및 문제 초안 작성</p><span class="tag">선택됨</span></div><div class="card"><h4>↗ 크롤링 수집</h4><p>허용 출처에서 자료 가져오기</p></div><div class="card"><h4>✎ 직접 입력/파일</h4><p>관리자 작성 또는 일괄 등록</p></div></div><div class="row"><div class="field">산출물: 요약 + 문제 ▾</div><div class="field">난이도: 보통 ▾</div><div class="field">문항 수: 10</div></div><div class="card"><h4>학습 목표 / 생성 지시</h4><p>일차함수의 뜻과 그래프의 특징을 이해하고 기울기를 설명한다.</p><p class="note">출처 및 단원 적합성을 검수한 후 승인해야 일정에 편성할 수 있습니다.</p></div><div class="toolbar"><button class="btn outline">임시 저장</button><button class="btn">초안 생성</button></div>`},
{id:'ADM-04',name:'콘텐츠 검수',path:'/admin/contents/review',role:'요약·문제 품질 확인 및 승인/반려',description:'콘텐츠의 교육과정 적합성, 정확성, 정답과 해설, 출처를 확인합니다.',nav:'콘텐츠 검수',events:[['대기 목록','유형, 학교 교육과정, 출처와 제출일을 확인하고 검수 대상을 선택합니다.'],['학생 화면 미리보기','학생에게 공개될 요약/문제의 형태로 내용과 출처 정보를 확인합니다.'],['정답·해설 점검','보기와 정답의 일치, 해설 정확성, 난이도와 단원 적합성을 확인합니다.'],['수정','검수자가 내용을 바로 수정하거나 작성자에게 반려할 수 있습니다. 수정 이력은 보존합니다.'],['승인/반려','승인하면 학습 세트에 사용할 수 있습니다. 반려 시 사유를 입력하고 재검수를 요청할 수 있게 합니다.']],body:`<div class="toolbar"><div class="select">검수 대기 12건 ▾</div><div class="select">수학 · 2학년 ▾</div><button class="btn outline">이전</button><button class="btn outline">다음</button></div><div class="card"><div class="row"><div><h4>요약 · 일차함수의 그래프</h4><p>한빛중 2학년 · 미래교육 · 3단원</p></div><div style="text-align:right"><span class="tag amber">검수 대기</span><p>AI 생성 · 11/04 09:42</p></div></div><hr style="border:0;border-top:1px solid #edf0f5"><h4>핵심 개념</h4><p>일차함수 y=ax+b의 그래프는 직선이며, a는 기울기, b는 y절편이다.</p><h4 style="margin-top:12px">검수 체크</h4><p>☑ 단원 적합성　☑ 수식/개념 정확성　☐ 교과서 표현 일치</p></div><div class="card"><h4>연결 문제 미리보기</h4><p>기울기가 2이고 y절편이 -1인 직선의 식은?</p><p>정답: y=2x-1 · 해설: y=ax+b에 기울기와 절편을 대입한다.</p></div><div class="toolbar"><button class="btn outline">수정 후 저장</button><button class="btn red">반려 사유 입력</button><button class="btn">승인</button></div>`},
{id:'ADM-05',name:'학습 세트 편집',path:'/admin/learning-sets',role:'승인 콘텐츠를 단원 학습 묶음으로 구성',description:'단원별 요약과 문제를 순서 및 분량에 맞게 묶어 일일 스케줄에 사용할 세트를 만듭니다.',nav:'학습 세트',events:[['세트 정보','세트명, 학교 교육과정, 과목·출판사·단원, 학습 목표와 예상 시간을 입력합니다.'],['콘텐츠 선택','승인된 요약과 문제만 검색해 세트에 추가합니다. 학교별 단원 매핑과 교과서 판본을 확인합니다.'],['순서와 분량','요약 후 문제처럼 학습 순서를 배치하고 문항 수와 예상 학습 시간을 조정합니다.'],['미리보기','학생 화면에서 보일 학습 순서와 콘텐츠 상태를 확인합니다.'],['저장','세트는 일정에 편성되기 전까지 초안으로 저장할 수 있습니다.']],body:`<div class="toolbar"><input class="field" value="수학 2-3 일일 학습"><span class="tag green">단원: 일차함수</span><button class="btn outline">학생 미리보기</button></div><div class="row"><div style="flex:1.1"><h4 style="font-size:10px">세트 구성 순서</h4><div class="card"><span class="tag">01 요약</span><h4>일차함수 핵심 개념</h4><p>약 8분 · 승인됨 · 미래교육 3단원</p></div><div class="card"><span class="tag">02 문제</span><h4>개념 확인 문제 1~5</h4><p>약 12분 · 5문항 · 난이도 보통</p></div><div class="card"><span class="tag">03 문제</span><h4>그래프 적용 문제 1~5</h4><p>약 15분 · 5문항 · 난이도 도전</p></div></div><div style="flex:1"><h4 style="font-size:10px">승인 콘텐츠 찾기</h4><div class="toolbar"><input class="search" placeholder="제목 검색"></div><div class="tree"><div>☑ 요약 · 일차함수 핵심</div><div>☐ 문제 · 기울기 기본 10문항</div><div>☐ 문제 · 그래프 해석 8문항</div><div>☐ 요약 · 교과서 보충 설명</div></div><div class="card"><h4>예상 학습량</h4><p>총 35분 · 요약 1개 · 문제 10문항</p></div></div></div><div class="toolbar"><button class="btn outline">초안 저장</button><button class="btn">세트 저장</button></div>`},
{id:'ADM-06',name:'단원별 일정 편성',path:'/admin/schedules',role:'날짜별 단원 학습 편성 및 학생 할당',description:'학교·학년·출판사별 단원을 기준으로 학습 세트를 날짜에 배치하고 학생 또는 그룹에 공개합니다.',nav:'단원 일정',events:[['캘린더 범위','주/월 단위로 일정을 살펴보고 학교, 학년, 과목, 그룹으로 필터링합니다.'],['일정 정보','학습 날짜, 공개 시각, 마감(선택), 반복 여부를 설정합니다. 일정 하나에는 단원 하나의 학습 세트를 연결합니다.'],['단원·세트 선택','대상 학교 교육과정의 단원과 승인된 학습 세트를 연결합니다. 미승인·미매핑 단원은 공개할 수 없습니다.'],['대상 할당','학생 또는 그룹을 선택하고 인원·중복 배정·개인 skip 충돌을 미리 확인합니다.'],['예약/공개','학생 미리보기 후 예약하거나 즉시 공개합니다. 공개 후 변경은 영향 안내와 변경 이력을 남깁니다.']],body:`<div class="toolbar"><button class="btn outline">‹</button><strong style="font-size:11px">2026년 11월 · 2주</strong><button class="btn outline">›</button><div class="select">한빛중 · 2학년 ▾</div><div class="select">수학 ▾</div><button class="btn">+ 단원 일정</button></div><div class="grid"><div class="card"><h4>월 9일</h4><p>수학 · 3단원 일차함수</p><span class="tag green">24명 할당</span></div><div class="card"><h4>화 10일</h4><p>수학 · 3단원 그래프</p><span class="tag amber">예약 08:00</span></div><div class="card"><h4>수 11일</h4><p>일정 없음</p><button class="btn light">+ 편성</button></div></div><div class="card"><h4>일정 편성 상세</h4><div class="row"><div class="field">학습일: 2026-11-10</div><div class="field">학교/학년: 한빛중 2학년</div></div><div class="row"><div class="field">과목/출판사: 수학 · 미래교육</div><div class="field">단원: 3단원 일차함수</div></div><div class="row"><div class="field">학습 세트: 수학 2-3 일일 학습</div><div class="field">대상: 2학년 A반 (24명)</div></div><p class="note">⚠ 대상 중 2명은 해당 단원을 개인 진도에서 skip 처리했습니다. 공통 일정은 유지되며 개인 학습 목록에서는 제외됩니다.</p></div><div class="toolbar"><button class="btn outline">임시 저장</button><button class="btn light">대상 미리보기</button><button class="btn">예약/공개</button></div>`},
{id:'ADM-07',name:'학생 개인 진도 설정',path:'/admin/student-progress',role:'중간 합류 학생의 시작점 및 개인 skip 설정',description:'공통 단원 일정을 바꾸지 않고 개별 학생의 시작 단원, 완료 확인, skip/복구 상태를 관리합니다.',nav:'개인 학습 진도',events:[['학생 찾기','학생 이름/ID로 검색해 학교, 학년, 적용 연도와 연결된 교과서 편성을 확인합니다.'],['개인 과목 선택','과목별 교과서 출판사·판본과 단원 트리를 표시합니다. 편성이 없거나 불일치하면 먼저 교육과정을 연결합니다.'],['시작점 지정','학생이 현재 학습 중인 단원을 설정합니다. 이전 단원은 진단 필요, 완료 확인, skip 중에서 선택합니다.'],['Skip 처리','선택한 학생에게만 적용합니다. 사유 입력과 설정자/시간 기록이 필수이며 성취도에는 포함하지 않습니다.'],['진도율·복구','완료율과 처리율을 구분해 미리 보고, skip을 취소하면 해당 학생에게 다시 학습 대상으로 돌립니다.']],body:`<div class="toolbar"><input class="search" value="김민서 (STU-2041)"><button class="btn light">학생 조회</button><span class="tag">중간 합류</span></div><div class="card"><h4>학생 교육과정</h4><p>한빛중학교 · 중학교 2학년 · 2026학년도</p><p>수학 · 미래교육 · 중학 수학 2 (2026)</p></div><div class="row"><div style="flex:1.1"><h4 style="font-size:10px">단원별 개인 진도</h4><div class="tree"><div>✓ 1단원 유리수와 순환소수 <span class="tag green">완료</span></div><div class="skip">↷ 2단원 식의 계산 <span class="tag amber">건너뜀</span></div><div>● 3단원 일차함수 <span class="tag">현재 시작점</span></div><div class="indent">○ 3-1 함수와 그래프 <span class="tag amber">오늘 일정</span></div><div class="indent">○ 3-2 일차함수의 그래프</div><div>○ 4단원 연립방정식</div></div></div><div style="flex:1"><div class="card"><h4>선택 단원: 2단원 식의 계산</h4><p>상태: SKIPPED</p><p>사유: 학원 선행 학습 확인</p><p>설정자/시각: 관리자 · 11/03 14:20</p><button class="btn outline">Skip 복구</button></div><div class="card"><h4>개인 진도율 미리보기</h4><p>학습 완료율 <b>33%</b> · 완료 1 / 활성 3단원</p><p>건너뜀 1단원은 완료·성취도에서 제외</p><div class="progress"><i style="width:33%"></i></div></div></div></div><div class="toolbar"><button class="btn outline">시작 단원 변경</button><button class="btn warn">선택 단원 Skip</button><button class="btn">변경 저장</button></div><p class="note">개인 진도 변경은 김민서에게만 적용됩니다. 공통 스케줄 및 다른 학생의 상태는 변경되지 않습니다.</p>`},
{id:'ADM-08',name:'학생별 일정 진행 현황',path:'/admin/schedules/:id/progress',role:'일정 수행 및 결과 모니터링',description:'단원 일정별 학생 진행률, 문제 결과, 오답 복습 여부를 확인합니다.',nav:'진행 현황',events:[['일정 요약','학교·학년·과목·출판사·단원, 공개일, 할당 학생 수를 표시합니다.'],['상태 필터','미시작, 진행 중, 완료, 개인 skip 대상별로 학생 목록을 필터링합니다.'],['결과 지표','요약 완료, 문제 제출, 정답률, 소요 시간, 오답 복습 상태를 확인합니다.'],['개인 상세','학생별 개인 진도와 일정 수행을 열람합니다. 개인 skip은 미완료로 오인하지 않도록 구분 표시합니다.'],['운영 조치','대상 추가/제외, 일정 변경 또는 재할당은 변경 영향을 확인하고 이력으로 남깁니다.']],body:`<div class="card"><div class="row"><div><h4>수학 · 3단원 일차함수</h4><p>한빛중 2학년 · 미래교육 · 2026-11-10</p></div><div style="text-align:right"><span class="tag green">진행 중</span><p>24명 할당</p></div></div><div class="progress"><i style="width:67%"></i></div><p>전체 완료율 67% · 평균 정답률 81%</p></div><div class="toolbar"><input class="search" placeholder="학생 검색"><div class="select">전체 상태 ▾</div><button class="btn outline">결과 내보내기</button></div><table class="table"><thead><tr><th>학생</th><th>단원 상태</th><th>요약</th><th>문제</th><th>정답률</th><th>오답 복습</th></tr></thead><tbody><tr><td>김민서</td><td><span class="tag amber">개인 skip</span></td><td>제외</td><td>제외</td><td>—</td><td>—</td></tr><tr><td>이하준</td><td><span class="tag">진행 중</span></td><td>완료</td><td>6/10</td><td>83%</td><td><span class="tag amber">2건 대기</span></td></tr><tr><td>박서윤</td><td><span class="tag green">완료</span></td><td>완료</td><td>10/10</td><td>90%</td><td><span class="tag green">완료</span></td></tr></tbody></table><div class="card"><h4>진도 집계 기준</h4><p>개인 skip 단원은 일정 대상에서 별도 표시하며 완료율 및 성취도에 포함하지 않습니다.</p></div>`}
];
const tabs=document.getElementById('tabs'),sheets=document.getElementById('sheets');
screens.forEach((s,i)=>{const b=document.createElement('button');b.textContent=`${String(i+1).padStart(2,'0')} ${s.nav}`;b.onclick=()=>show(i);tabs.appendChild(b);
const sec=document.createElement('section');sec.className='sheet';sec.id=`sheet-${i}`;sec.innerHTML=`<div class="sheet-head"><div><label>화면 ID</label><strong>${s.id}</strong></div><div><label>화면명</label><strong>${s.name}</strong></div><div><label>경로</label><strong>${s.path}</strong></div><div><label>화면 역할</label><strong>${s.role}</strong></div></div><div class="split"><section class="canvas"><h2 class="section-title">화면 레이아웃 (와이어프레임)</h2><div class="mock"><div class="mock-top"><span>Daily Study · 관리자</span><em>알림　 관리자 ▾</em></div><div class="app"><aside class="side"><div class="brand">DAILY STUDY</div><span>운영 대시보드</span><span class="on">${s.nav}</span><span>학습 데이터</span><span>학습 세트</span><span>학습 스케줄</span><span>학교·교육과정</span><span>개인 학습 진도</span><span>학생·학부모</span></aside><div class="workspace"><div class="crumb">관리자　›　${s.name}</div><h3 class="title">${s.name}</h3><p class="sub">${s.description}</p>${s.body}<div class="note">※ 실제 저장 전 확인 모달을 제공하고, 권한 없는 데이터는 서버에서 차단합니다.</div></div></div></div><div class="legend"><span>화면 너비: 데스크톱 우선</span><span>반응형: 태블릿/모바일에서 메뉴 접기</span><span>권한: ADMIN</span></div></section><section class="events"><h2 class="section-title">화면 역할 및 이벤트 정의</h2>${s.events.map((e,j)=>`<article class="event"><div class="num">${j+1}</div><div><h3>${e[0]}</h3><p>${e[1]}</p></div></article>`).join('')}<h2 class="section-title" style="margin-top:24px">공통 처리 규칙</h2><article class="event"><div class="num">✓</div><div><h3>권한 및 이력</h3><p>화면 메뉴 노출과 별도로 API에서 ADMIN 역할을 검증합니다. 생성·수정·승인·할당·skip 변경은 변경자와 시각을 기록합니다.</p></div></article><article class="event"><div class="num">!</div><div><h3>오류·빈 상태</h3><p>목록이 비어 있거나 조회에 실패한 경우 안내 문구와 재시도/생성 동작을 제공합니다. 저장 오류 시 입력값을 보존합니다.</p></div></article><p class="note">이벤트 번호는 왼쪽 화면 항목과 연결되는 기능 설명입니다.</p></section></div>`;sheets.appendChild(sec)});
function show(i){document.querySelectorAll('.sheet').forEach((x,n)=>x.classList.toggle('active',n===i));document.querySelectorAll('.tabs button').forEach((x,n)=>x.classList.toggle('active',n===i));history.replaceState(null,'',`#${screens[i].id}`);window.scrollTo({top:0,behavior:'smooth'})}
const initial=Math.max(0,screens.findIndex(s=>s.id===location.hash.slice(1)));show(initial);
</script>
</body>
</html>
